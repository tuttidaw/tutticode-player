<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Methods and events · @tuttidaw/tutticode-player</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://tuttidaw.com/embed/v1.js" defer></script>
</head>
<body>
  <p><a href="../">← all examples</a></p>
  <h1>Methods and events</h1>
  <p>Drive a card from your page: <code>play()</code>, <code>stop()</code> and <code>setCode()</code>, and listen to its <code>tuttidaw:*</code> events. Browsers start audio only after a click on the page, so call <code>play()</code> from a click handler.</p>

  <tuttidaw-code id="card" theme="dark" code='setcpm(32)
drums: s("bd*4, [~ hh]*4").bank("tr808")
acid: note("c2 c3 eb2 c2 g2 c2 bb1 c3").s("sawtooth").lpf(sine.range(300, 2400).slow(4)).lpq(12).gain(0.6)
master.fx("Limiter")'></tuttidaw-code>

  <div>
    <button id="play">play()</button>
    <button id="stop">stop()</button>
    <button id="koto">setCode(koto)</button>
    <button id="house">setCode(house)</button>
  </div>
  <div class="log" id="log" aria-live="polite"></div>

  <h2>The script</h2>
  <pre id="source"></pre>

  <script id="demo">
    const card = document.getElementById('card');
    const log = (line) => {
      const el = document.getElementById('log');
      el.textContent += `${new Date().toLocaleTimeString()}  ${line}\n`;
      el.scrollTop = el.scrollHeight;
    };
    const PROGRAMS = {
      koto: `setcpm(22)
koto: n("0 2 4 <7 5> 4 2").scale("D5:minor:pentatonic").s("gm_koto")
bass: note("<d2 a1 bb1 c2>").s("gm_acoustic_bass")`,
      house: `setcpm(31)
drums: s("bd*4, [~ hh]*4, ~ cp ~ cp").bank("tr909")
chords: chord("<Am9 F^7 C^7 G6>").voicing().struct("~ x ~ x").s("gm_epiano1")`,
    };
    document.getElementById('play').onclick = () => card.play();
    document.getElementById('stop').onclick = () => card.stop();
    document.getElementById('koto').onclick = () => card.setCode(PROGRAMS.koto);
    document.getElementById('house').onclick = () => card.setCode(PROGRAMS.house);
    for (const type of ['ready', 'playing', 'stopped', 'ended', 'error']) {
      card.addEventListener(`tuttidaw:${type}`, (event) =>
        log(`tuttidaw:${type} ${JSON.stringify(event.detail)}`)
      );
    }
  </script>
  <script>
    document.getElementById('source').textContent =
      document.getElementById('demo').textContent.trim();
  </script>
</body>
</html>
